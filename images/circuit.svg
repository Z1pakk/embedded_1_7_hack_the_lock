<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="gnd" stroke="#333" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="10"/>
      <line x1="-10" y1="10" x2="10" y2="10"/>
      <line x1="-6" y1="15" x2="6" y2="15"/>
      <line x1="-2" y1="20" x2="2" y2="20"/>
    </g>
  </defs>

  <rect width="760" height="700" fill="#ffffff"/>

  <!-- ESP32-S3 -->
  <rect x="40" y="40" width="200" height="590" rx="8" fill="#eef2f6" stroke="#333" stroke-width="2"/>
  <text x="140" y="70" text-anchor="middle" font-weight="bold" font-size="15">ESP32-S3</text>
  <text x="140" y="88" text-anchor="middle" fill="#555">DevKitC-1</text>

  <g text-anchor="end" fill="#222">
    <text x="228" y="144">GPIO 15</text>
    <text x="228" y="214">GPIO 16</text>
    <text x="228" y="284">GPIO 14</text>
    <text x="228" y="344">GPIO 11</text>
    <text x="228" y="374">GPIO 10</text>
    <text x="228" y="404">GPIO 12</text>
    <text x="228" y="454">GPIO 40</text>
    <text x="228" y="479">GPIO 39</text>
    <text x="228" y="504">GPIO 6</text>
    <text x="228" y="529">GPIO 5</text>
    <text x="228" y="554">GPIO 4</text>
    <text x="228" y="579">GPIO 41</text>
    <text x="228" y="604">GPIO 42</text>
  </g>

  <!-- Напрямок сигналу: входи ESP32 -->
  <g fill="#333">
    <polygon points="280,140 296,133 296,147"/>
    <polygon points="280,210 296,203 296,217"/>
  </g>
  <g fill="#555" font-size="11" text-anchor="middle">
    <text x="320" y="132">вхід</text>
    <text x="320" y="202">вхід</text>
  </g>

  <!-- Потенціометр -->
  <line x1="240" y1="140" x2="460" y2="140" stroke="#333" stroke-width="2"/>
  <rect x="460" y="110" width="20" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="470" y1="110" x2="470" y2="88" stroke="#333" stroke-width="2"/>
  <text x="470" y="82" text-anchor="middle" font-weight="bold">3V3</text>
  <use href="#gnd" x="470" y="170"/>
  <text x="495" y="136">Потенціометр 10 кОм</text>
  <text x="495" y="154" fill="#555" font-size="12">середній вивід → GPIO 15</text>

  <!-- Кнопка -->
  <line x1="240" y1="210" x2="540" y2="210" stroke="#333" stroke-width="2"/>
  <line x1="540" y1="210" x2="585" y2="192" stroke="#333" stroke-width="2"/>
  <line x1="590" y1="210" x2="630" y2="210" stroke="#333" stroke-width="2"/>
  <use href="#gnd" x="630" y="210"/>
  <text x="540" y="182">Кнопка</text>
  <text x="540" y="246" fill="#555" font-size="12">INPUT_PULLUP, до GND</text>

  <!-- Зумер -->
  <line x1="240" y1="280" x2="440" y2="280" stroke="#333" stroke-width="2"/>
  <rect x="440" y="258" width="190" height="52" rx="6" fill="#f7f3e8" stroke="#333" stroke-width="2"/>
  <text x="450" y="284" font-weight="bold">S</text>
  <text x="535" y="281" text-anchor="middle">Модуль зумера</text>
  <text x="535" y="298" text-anchor="middle" fill="#555" font-size="12">(пасивний)</text>
  <text x="620" y="289" text-anchor="end" font-weight="bold">−</text>
  <line x1="630" y1="284" x2="670" y2="284" stroke="#333" stroke-width="2"/>
  <use href="#gnd" x="670" y="284"/>

  <!-- RGB світлодіод -->
  <g stroke-width="2">
    <line x1="240" y1="340" x2="360" y2="340" stroke="#d22"/>
    <line x1="400" y1="340" x2="480" y2="340" stroke="#d22"/>
    <line x1="240" y1="370" x2="360" y2="370" stroke="#1a9a1a"/>
    <line x1="400" y1="370" x2="480" y2="370" stroke="#1a9a1a"/>
    <line x1="240" y1="400" x2="360" y2="400" stroke="#2a5bd7"/>
    <line x1="400" y1="400" x2="480" y2="400" stroke="#2a5bd7"/>
  </g>
  <g fill="#fff" stroke="#333" stroke-width="2">
    <rect x="360" y="334" width="40" height="12"/>
    <rect x="360" y="364" width="40" height="12"/>
    <rect x="360" y="394" width="40" height="12"/>
  </g>
  <g text-anchor="middle" font-size="10" fill="#555">
    <text x="380" y="330">220 Ω</text>
    <text x="380" y="360">220 Ω</text>
    <text x="380" y="390">220 Ω</text>
  </g>
  <rect x="480" y="322" width="150" height="96" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="490" y="344" font-weight="bold" fill="#d22">R</text>
  <text x="490" y="374" font-weight="bold" fill="#1a9a1a">G</text>
  <text x="490" y="404" font-weight="bold" fill="#2a5bd7">B</text>
  <text x="550" y="366" text-anchor="middle" font-weight="bold">RGB</text>
  <text x="550" y="382" text-anchor="middle" fill="#555" font-size="11">спільний катод</text>
  <text x="624" y="374" text-anchor="end" font-size="11">COM</text>
  <line x1="630" y1="370" x2="670" y2="370" stroke="#333" stroke-width="2"/>
  <use href="#gnd" x="670" y="370"/>

  <!-- 7-сегментний індикатор -->
  <text x="500" y="440" font-weight="bold">7-сегментний індикатор</text>
  <g stroke="#333" stroke-width="2">
    <line x1="240" y1="450" x2="360" y2="450"/><line x1="400" y1="450" x2="500" y2="450"/>
    <line x1="240" y1="475" x2="360" y2="475"/><line x1="400" y1="475" x2="500" y2="475"/>
    <line x1="240" y1="500" x2="360" y2="500"/><line x1="400" y1="500" x2="500" y2="500"/>
    <line x1="240" y1="525" x2="360" y2="525"/><line x1="400" y1="525" x2="500" y2="525"/>
    <line x1="240" y1="550" x2="360" y2="550"/><line x1="400" y1="550" x2="500" y2="550"/>
    <line x1="240" y1="575" x2="360" y2="575"/><line x1="400" y1="575" x2="500" y2="575"/>
    <line x1="240" y1="600" x2="360" y2="600"/><line x1="400" y1="600" x2="500" y2="600"/>
  </g>
  <g fill="#fff" stroke="#333" stroke-width="2">
    <rect x="360" y="445" width="40" height="10"/>
    <rect x="360" y="470" width="40" height="10"/>
    <rect x="360" y="495" width="40" height="10"/>
    <rect x="360" y="520" width="40" height="10"/>
    <rect x="360" y="545" width="40" height="10"/>
    <rect x="360" y="570" width="40" height="10"/>
    <rect x="360" y="595" width="40" height="10"/>
  </g>
  <text x="380" y="622" text-anchor="middle" font-size="10" fill="#555">7 × 220 Ω</text>

  <rect x="500" y="447" width="190" height="168" rx="8" fill="#222" stroke="#333" stroke-width="2"/>
  <g fill="#ddd" font-weight="bold">
    <text x="510" y="454">a</text>
    <text x="510" y="479">b</text>
    <text x="510" y="504">c</text>
    <text x="510" y="529">d</text>
    <text x="510" y="554">e</text>
    <text x="510" y="579">f</text>
    <text x="510" y="604">g</text>
  </g>
  <g fill="#ff3b30">
    <rect x="604" y="460" width="46" height="8" rx="3"/>
    <rect x="652" y="470" width="8" height="46" rx="3"/>
    <rect x="652" y="528" width="8" height="46" rx="3"/>
    <rect x="604" y="576" width="46" height="8" rx="3"/>
    <rect x="594" y="528" width="8" height="46" rx="3"/>
    <rect x="594" y="470" width="8" height="46" rx="3"/>
    <rect x="604" y="518" width="46" height="8" rx="3"/>
  </g>
  <g fill="#aaa" font-size="10" text-anchor="middle">
    <text x="627" y="480">a</text>
    <text x="672" y="497">b</text>
    <text x="672" y="555">c</text>
    <text x="627" y="572">d</text>
    <text x="582" y="555">e</text>
    <text x="582" y="497">f</text>
    <text x="627" y="540">g</text>
  </g>
  <line x1="627" y1="615" x2="627" y2="630" stroke="#333" stroke-width="2"/>
  <text x="619" y="630" font-size="11" text-anchor="end">COM (спільний катод)</text>
  <use href="#gnd" x="627" y="630"/>

  <!-- Легенда -->
  <text x="40" y="675" fill="#444" font-size="12">⏚ — GND плати ESP32 · 3V3 — пін 3V3 плати · резистори 220–330 Ω на кожен сегмент і кожен колір RGB</text>
</svg>
